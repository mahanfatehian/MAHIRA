name: Build & Release

# How releases are produced:
#   - Push a tag like `v1.2.3`  -> builds Windows + macOS, then publishes a
#     GitHub Release (as a draft) with the installers attached.
#   - Run manually (Actions tab -> "Run workflow") -> builds the installers and
#     uploads them as workflow artifacts WITHOUT creating a release. Use this to
#     test packaging before you ever cut a real release.
#
# Targets (latest GitHub-hosted runners):
#   - Windows: windows-latest  (x64)        -> Inno Setup installer + portable zip
#   - macOS:   macos-latest    (Apple Silicon / arm64) -> .dmg + .zip
# Apple Silicon only: GitHub is retiring Intel macOS runners. arm64 apps do not
# run on Intel Macs; add a `macos-13` matrix entry while it lasts if you need x86_64.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for a manual test build"
        required: false
        default: "0.1.0-dev"

permissions:
  contents: write   # needed by the release job to create/upload a Release

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Fixes the Node.js 20 deprecation warnings in GitHub Actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # pull the Piper .onnx voice models (Git LFS), not pointer stubs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v') { $ver = $ref.Substring(1) }
          else { $ver = "${{ github.event.inputs.version }}" }
          if (-not $ver) { $ver = "0.1.0-dev" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MAHIRA_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify LFS assets are real (not pointers)
        shell: pwsh
        run: |
          $m = Get-ChildItem assets/audio/models/*.onnx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $m) { Write-Error "Voice model missing"; exit 1 }
          if ($m.Length -lt 1MB) { Write-Error "Voice model is an LFS pointer ($($m.Length) bytes). Checkout did not pull LFS."; exit 1 }
          Write-Host "Voice model OK: $([math]::Round($m.Length/1MB,1)) MB"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          pip install -r requirements-build.txt

      - name: Smoke-check imports
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "import mahira, PySide6.QtWidgets, sklearn, scipy, numpy, joblib; print('imports OK')"

      - name: Build app (PyInstaller)
        shell: pwsh
        run: pyinstaller packaging/mahira.spec --noconfirm

      - name: Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/artifacts | Out-Null
          Compress-Archive -Path dist/MAHIRA/* -DestinationPath "dist/artifacts/MAHIRA-$env:VERSION-win64-portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" packaging\windows\mahira.iss
          Copy-Item dist/installer/*.exe dist/artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # pull the Piper .onnx voice models (Git LFS), not pointer stubs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* ]]; then ver="${ref#v}"; else ver="${{ github.event.inputs.version }}"; fi
          [ -z "$ver" ] && ver="0.1.0-dev"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "MAHIRA_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Verify LFS assets are real (not pointers)
        run: |
          m=$(ls assets/audio/models/*.onnx 2>/dev/null | head -1)
          if [ -z "$m" ]; then echo "Voice model missing"; exit 1; fi
          sz=$(stat -f%z "$m")
          if [ "$sz" -lt 1000000 ]; then echo "Voice model is an LFS pointer ($sz bytes). Checkout did not pull LFS."; exit 1; fi
          echo "Voice model OK: $sz bytes"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          pip install -r requirements-build.txt

      - name: Smoke-check imports
        run: PYTHONPATH=src python -c "import mahira, PySide6.QtWidgets, sklearn, scipy, numpy, joblib; print('imports OK')"

      - name: Generate .icns from logo (best effort)
        run: |
          set -e
          mkdir -p build/icon.iconset
          # Convert the bundled .ico to a PNG using the installed Qt (PySide6),
          # then build an .icns with iconutil. Non-fatal if it fails.
          python - <<'PY' || true
          from PySide6.QtGui import QImage
          img = QImage("assets/logo.ico")
          if not img.isNull():
              img.save("build/logo.png", "PNG")
          PY
          if [ -f build/logo.png ]; then
            for s in 16 32 64 128 256 512; do
              sips -z $s $s build/logo.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null 2>&1 || true
              d=$((s*2)); sips -z $d $d build/logo.png --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null 2>&1 || true
            done
            iconutil -c icns build/icon.iconset -o assets/logo.icns || true
          fi

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/mahira.spec --noconfirm

      - name: Ad-hoc codesign (so the unsigned arm64 app launches)
        run: |
          set -e
          codesign --force --deep --sign - "dist/MAHIRA.app"
          codesign --verify --deep --strict "dist/MAHIRA.app" || true

      - name: Package DMG + ZIP
        run: |
          set -e
          mkdir -p dist/artifacts dist/dmg
          cp -R "dist/MAHIRA.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "MAHIRA" -srcfolder dist/dmg -ov -format UDZO \
            "dist/artifacts/MAHIRA-$VERSION-macos-arm64.dmg"
          ditto -c -k --keepParent "dist/MAHIRA.app" "dist/artifacts/MAHIRA-$VERSION-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    # Only publish a Release for real version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*