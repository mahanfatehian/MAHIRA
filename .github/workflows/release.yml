name: Build & Release

# How releases are produced:
#   - Push a tag like `v1.2.3`  -> builds Windows + macOS, then publishes a
#     GitHub Release (as a draft) with the installers attached.
#   - Run manually (Actions tab -> "Run workflow") -> builds the installers and
#     uploads them as workflow artifacts WITHOUT creating a release. Use this to
#     test packaging before you ever cut a real release.
#
# Targets (GitHub-hosted runners):
#   - Windows: windows-latest  (x64)            -> Inno Setup installer (.exe)
#   - macOS:   macos-14 (Apple Silicon / arm64) -> arm64 .dmg
# Apple Silicon only by choice: an arm64 build finishes in ~6 min, vs the slow
# Intel (macos-13) runner. Intel Macs are not supported. If you ever need x86_64
# again, add a `macos-13` matrix entry back.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for a manual test build"
        required: false
        default: "0.1.0-dev"

permissions:
  contents: write   # needed by the release job to create/upload a Release

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Fixes the Node.js 20 deprecation warnings in GitHub Actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # pull the Piper .onnx voice models (Git LFS), not pointer stubs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: python packaging/resolve_release_version.py

      - name: Verify LFS assets are real (not pointers)
        shell: pwsh
        run: |
          $models = Get-ChildItem -Path assets/models -Recurse -Filter *.onnx -ErrorAction SilentlyContinue
          if (-not $models) { Write-Error "No model files found under assets/models"; exit 1 }
          foreach ($m in $models) {
            if ($m.Length -lt 1MB) { Write-Error "$($m.Name) is an LFS pointer ($($m.Length) bytes). Checkout did not pull LFS."; exit 1 }
            Write-Host "$($m.Name) OK: $([math]::Round($m.Length/1MB,1)) MB"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          pip install -r requirements-build.txt

      - name: Smoke-check imports
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "import mahira, PySide6.QtWidgets, sklearn, scipy, numpy, joblib; print('imports OK')"

      - name: Run fast test gate
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pytest -m "not slow" --timeout=60 -q

      - name: Build app (PyInstaller)
        shell: pwsh
        run: pyinstaller packaging/mahira.spec --noconfirm

      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:MAHIRA_DATA_DIR = "$env:RUNNER_TEMP\mahira-health"
          $process = Start-Process -FilePath "dist\MAHIRA\MAHIRA.exe" -ArgumentList "--health-check" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged health check failed with exit code $($process.ExitCode)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" packaging\windows\mahira.iss
          New-Item -ItemType Directory -Force -Path dist/artifacts | Out-Null
          Copy-Item dist/installer/*.exe dist/artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/artifacts/*
          retention-days: 1   # keep storage under the 500 MB free-tier cap
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  build-macos:
    # Apple Silicon only. macos-14 is the latest stable macOS runner (arm64);
    # Intel (macos-13) is intentionally dropped so releases build in ~6 min.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # pull the Piper .onnx voice models (Git LFS), not pointer stubs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: python packaging/resolve_release_version.py

      - name: Verify LFS assets are real (not pointers)
        run: |
          found=0
          for m in $(find assets/models -name '*.onnx'); do
            found=1
            sz=$(stat -f%z "$m")
            if [ "$sz" -lt 1000000 ]; then echo "$(basename "$m") is an LFS pointer ($sz bytes). Checkout did not pull LFS."; exit 1; fi
            echo "$(basename "$m") OK: $sz bytes"
          done
          if [ "$found" -eq 0 ]; then echo "No model files found under assets/models"; exit 1; fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          pip install -r requirements-build.txt

      - name: Smoke-check imports
        run: PYTHONPATH=src python -c "import mahira, PySide6.QtWidgets, sklearn, scipy, numpy, joblib; print('imports OK')"

      - name: Run fast test gate
        run: PYTHONPATH=src python -m pytest -m "not slow" --timeout=60 -q

      - name: Generate .icns from logo (best effort)
        run: |
          set -e
          mkdir -p build/icon.iconset
          # Convert the bundled .ico to a PNG using the installed Qt (PySide6),
          # then build an .icns with iconutil. Non-fatal if it fails.
          python - <<'PY' || true
          from PySide6.QtGui import QImage
          img = QImage("assets/logo.ico")
          if not img.isNull():
              img.save("build/logo.png", "PNG")
          PY
          if [ -f build/logo.png ]; then
            for s in 16 32 64 128 256 512; do
              sips -z $s $s build/logo.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null 2>&1 || true
              d=$((s*2)); sips -z $d $d build/logo.png --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null 2>&1 || true
            done
            iconutil -c icns build/icon.iconset -o assets/logo.icns || true
          fi

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/mahira.spec --noconfirm

      - name: Verify packaged application
        run: |
          export MAHIRA_DATA_DIR="$RUNNER_TEMP/mahira-health"
          "dist/MAHIRA.app/Contents/MacOS/MAHIRA" --health-check

      - name: Ad-hoc codesign (so the unsigned arm64 app launches)
        run: |
          set -e
          # Strip extended attributes (Finder/quarantine metadata) BEFORE signing.
          # Leftover xattrs corrupt the code signature, which makes Gatekeeper
          # reject the app on recent macOS ("damaged" / "not appropriate for this
          # version of macOS"). A clean tree + clean ad-hoc signature fixes that.
          xattr -cr "dist/MAHIRA.app"
          codesign --force --deep --sign - "dist/MAHIRA.app"
          codesign --verify --deep --strict --verbose=2 "dist/MAHIRA.app"

      - name: Package DMG
        run: |
          set -e
          mkdir -p dist/artifacts dist/dmg
          cp -R "dist/MAHIRA.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "MAHIRA" -srcfolder dist/dmg -ov -format UDZO \
            "dist/artifacts/MAHIRA-$VERSION-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/artifacts/*
          retention-days: 1   # keep storage under the 500 MB free-tier cap
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    # Only publish a Release for real version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST (before artifacts are downloaded) so its clean step never
      # wipes them — we only need the repo here for RELEASE_NOTES.md.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false              # publish straight to the Releases tab on a vX.Y.Z tag
          body_path: RELEASE_NOTES.md     # human-written description; the generated notes are appended
          generate_release_notes: true
          fail_on_unmatched_files: true   # don't publish an empty release if artifacts are missing
          files: artifacts/**/*
